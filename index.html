<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ghibli Café ☕🍃</title>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Marcellus', serif;
      background-image: url('https://i.imgur.com/NCZL6KJ.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;
      color: #fff;
      text-shadow: 1px 1px 4px #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: brightness(70%);
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.3em;
      margin-bottom: 30px;
    }

    a.button {
      background-color: #ffffffbb;
      color: #000;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
    }

    a.button:hover {
      background-color: #fff;
      box-shadow: 0 0 15px #fff;
    }
  </style>
</head>
