<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junte-se ao nosso servidor!</title>
    <meta http-equiv="refresh" content="3;url=https://discord.gg/EEEjeBCSU8">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #7289DA;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1rem;
        }

        .cta {
            margin-top: 20px;
            padding: 10px;
            background-color: #FF4757;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .cta:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Você será redirecionado para o nosso servidor Discord!</h1>
        <p>Se o redirecionamento não acontecer automaticamente, clique no botão abaixo.</p>
        <a href="https://discord.gg/EEEjeBCSU8">
            <button class="cta">Entrar no servidor</button>
        </a>
    </div>

</body>
</html>
